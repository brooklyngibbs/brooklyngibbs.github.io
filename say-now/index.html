<main id="say-now-world" aria-label="Say Now floating image world">
  <div class="fw-page">
    <header><h1>say now</h1><a class="fw-work" href="../">← work</a></header>
    <p class="fw-loading" role="status">Loading the mood board…</p>
    <p class="fw-error" role="alert" hidden>The mood board couldn’t load. <a href="./">Reload the page</a>.</p>

      <div class="fw-atmosphere" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="fw-pictures"></div>
      <div class="fw-names"></div>
      <div class="fw-controls" role="group" aria-label="Explore the image world">
        <button type="button" class="fw-home cursor-interaction" aria-label="Reset view" title="Reset zoom and position"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 10a9 9 0 1 1 2.6 8.4M3 4v6h6"/></svg><span>reset</span></button>

      </div>
      <section class="fw-viewer" aria-label="Selected picture, notes and related images" hidden>

        <button type="button" class="fw-back cursor-interaction" aria-label="Return to the image world"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 5-7 7 7 7M5 12h14"/></svg></button>

          <img class="fw-hero" alt="">
          <div class="fw-copy">
            <h2 class="fw-caption"></h2>
            <section class="fw-note-block" aria-label="Photo notes" hidden>

              <p class="fw-note"></p>
